openapi: 3.0.3
info:
  title: Poker Hands Service API
  description: |
    A REST API service for calculating poker hand odds and probabilities.
    This service provides endpoints for calculating winning probabilities for different poker hands
    and analyzing hand type distributions.
    
    ## Features
    
    - **Odds Calculation**: Calculate winning probabilities for given hole cards and community board
    - **Hand Type Analysis**: Analyze probability distributions for different poker hand types
    - **Multiple Calculation Modes**: Support for exhaustive, Monte Carlo, and auto calculation modes
    - **Health Monitoring**: Service health check endpoint
    
    ## Getting Started
    
    The API accepts poker cards in the format `valueSuit` where:
    - Values: `2-9`, `T` (Ten), `J` (Jack), `Q` (Queen), `K` (King), `A` (Ace)
    - Suits: `h` (hearts), `d` (diamonds), `c` (clubs), `s` (spades)
    
    Example cards: `Ah` (Ace of hearts), `Td` (Ten of diamonds), `2c` (Two of clubs)
    
    ## Authentication
    
    This API does not require authentication at this time.
  version: 0.3.1
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT


paths:
  /api/odds:
    post:
      tags:
        - Odds Calculation
      summary: Calculate poker hand winning odds
      description: |
        Calculate winning probabilities for multiple players' hole cards with an optional community board.
        Supports different calculation modes: exhaustive (exact calculation), Monte Carlo (statistical simulation),
        and auto (automatically selects the best method based on input size).
        
        The service validates all input card formats and ensures at least 2 players are provided.
        Each player must have exactly 2 hole cards, and the board can contain 0-5 community cards.
      operationId: calculateOdds
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OddsRequest'
            examples:
              example1:
                summary: Two players with no board cards
                value:
                  holes: [
                    ["Ah", "Kh"],
                    ["Qd", "Jd"]
                  ]
              example2:
                summary: Three players with community board
                value:
                  holes: [
                    ["Ah", "As"],
                    ["Kd", "Kh"],
                    ["Qc", "Qd"]
                  ]
                  board: ["2h", "5d", "9c"]
              example3:
                summary: Monte Carlo mode with custom settings
                value:
                  holes: [
                    ["Ah", "Kh"],
                    ["Qd", "Jd"]
                  ]
                  options:
                    mode: "monteCarlo"
                    sampleSize: 50000
      responses:
        '200':
          description: Successful odds calculation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OddsResponse'
              examples:
                success:
                  summary: Successful calculation
                  value:
                    success: true
                    command: "odds"
                    data:
                      players: [
                        {
                          holeCards: ["Ah", "Kh"],
                          winChance: 0.65,
                          tieChance: 0.05,
                          winChanceError: 0.02
                        },
                        {
                          holeCards: ["Qd", "Jd"],
                          winChance: 0.3,
                          tieChance: 0.05
                        }
                      ]
        '400':
          description: Invalid input parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidCards:
                  summary: Invalid card format
                  value:
                    success: false
                    command: "odds"
                    error: "Invalid card format: invalid"
                insufficientPlayers:
                  summary: Not enough players
                  value:
                    success: false
                    command: "odds"
                    error: "Holes must be provided as an array with at least 2 players"
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                rateLimitExceeded:
                  summary: Rate limit exceeded
                  value:
                    success: false
                    command: "odds"
                    error: "Rate limit exceeded. Please try again later."
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                cliError:
                  summary: CLI execution error
                  value:
                    success: false
                    command: "odds"
                    error: "CLI execution failed: Invalid input"

  /api/percentages:
    post:
      tags:
        - Hand Analysis
      summary: Calculate hand type probabilities
      description: |
        Calculate the probability distribution for different poker hand types.
        This endpoint is currently not implemented and will return a 501 status code.
        
        When implemented, this endpoint will analyze the given hole cards and board
        to determine the likelihood of making each type of poker hand.
      operationId: calculatePercentages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PercentagesRequest'
      responses:
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                rateLimitExceeded:
                  summary: Rate limit exceeded
                  value:
                    success: false
                    command: "percentages"
                    error: "Rate limit exceeded. Please try again later."
        '501':
          description: Not implemented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notImplemented:
                  summary: Endpoint not implemented
                  value:
                    success: false
                    command: "percentages"
                    error: "Not implemented"

  /health:
    get:
      tags:
        - Health Check
      summary: Service health check
      description: |
        Check the health status of the Poker Hands Service.
        Returns a simple status indicating whether the service is running properly.
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                healthy:
                  summary: Healthy service
                  value:
                    success: true
                    data:
                      status: "healthy"

components:
  schemas:
    # Base response types
    ApiResponseBase:
      type: object
      properties:
        success:
          type: boolean
          description: Whether the operation was successful
        command:
          type: string
          description: The command that was executed
          enum: [odds, percentages]
    
    # Odds calculation schemas
    OddsRequest:
      type: object
      required:
        - holes
      properties:
        holes:
          type: array
          description: Array of player hole cards (each player must have exactly 2 cards)
          items:
            type: array
            items:
              type: string
              pattern: "^[2-9TJQKA][hdsc]$"
              description: A poker card in valueSuit format (e.g., 'Ah', 'Td', '2c')
            minItems: 2
            maxItems: 2
          minItems: 2
          example: [["Ah", "Kh"], ["Qd", "Jd"]]
        board:
          type: array
          description: Community cards (optional, 0-5 cards)
          items:
            type: string
            pattern: "^[2-9TJQKA][hdsc]$"
            description: A poker card in valueSuit format
          maxItems: 5
          example: ["2h", "5d", "9c"]
        options:
          type: object
          description: Calculation options
          properties:
            mode:
              type: string
              enum: [auto, exhaustive, monteCarlo]
              description: Calculation mode (default: auto)
              example: "monteCarlo"
            threshold:
              type: integer
              minimum: 1
              description: Threshold for auto mode (default: 10000)
              example: 50000
            sampleSize:
              type: integer
              minimum: 1
              description: Sample size for Monte Carlo mode (default: 10000)
              example: 100000
          example:
            mode: "monteCarlo"
            sampleSize: 50000
    
    OddsPlayerData:
      type: object
      required:
        - holeCards
        - winChance
        - tieChance
      properties:
        holeCards:
          type: array
          items:
            type: string
            description: The player's hole cards
          example: ["Ah", "Kh"]
        winChance:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Probability of winning (0-1)
          example: 0.65
        tieChance:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Probability of tying (0-1)
          example: 0.05
        winChanceError:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Confidence interval for win chance (Monte Carlo only)
          example: 0.02
    
    OddsData:
      type: object
      required:
        - players
      properties:
        players:
          type: array
          description: Array of players with their hole cards and odds
          items:
            $ref: '#/components/schemas/OddsPlayerData'
    
    OddsResponse:
      oneOf:
        - $ref: '#/components/schemas/OddsSuccessResponse'
        - $ref: '#/components/schemas/ErrorResponse'
    
    OddsSuccessResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          required:
            - success
            - command
            - data
          properties:
            success:
              const: true
            data:
              $ref: '#/components/schemas/OddsData'
    
    # Percentages calculation schemas
    PercentagesRequest:
      type: object
      required:
        - holes
      properties:
        holes:
          type: array
          description: Array of player hole cards (each player must have exactly 2 cards)
          items:
            type: array
            items:
              type: string
              pattern: "^[2-9TJQKA][hdsc]$"
              description: A poker card in valueSuit format
            minItems: 2
            maxItems: 2
          minItems: 1
          example: [["Ah", "Kh"]]
        board:
          type: array
          description: Community cards (optional, 0-5 cards)
          items:
            type: string
            pattern: "^[2-9TJQKA][hdsc]$"
            description: A poker card in valueSuit format
          maxItems: 5
          example: ["2h", "5d", "9c"]
    
    HandTypeData:
      type: object
      required:
        - count
        - percentage
      properties:
        count:
          type: integer
          minimum: 0
          description: Number of times this hand type was observed
          example: 123456
        percentage:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Probability of this hand type (0-1)
          example: 0.123456
    
    PercentagesData:
      type: object
      required:
        - highCard
        - pair
        - twoPair
        - threeOfAKind
        - straight
        - flush
        - fullHouse
        - fourOfAKind
        - straightFlush
        - royalFlush
      properties:
        highCard:
          $ref: '#/components/schemas/HandTypeData'
        pair:
          $ref: '#/components/schemas/HandTypeData'
        twoPair:
          $ref: '#/components/schemas/HandTypeData'
        threeOfAKind:
          $ref: '#/components/schemas/HandTypeData'
        straight:
          $ref: '#/components/schemas/HandTypeData'
        flush:
          $ref: '#/components/schemas/HandTypeData'
        fullHouse:
          $ref: '#/components/schemas/HandTypeData'
        fourOfAKind:
          $ref: '#/components/schemas/HandTypeData'
        straightFlush:
          $ref: '#/components/schemas/HandTypeData'
        royalFlush:
          $ref: '#/components/schemas/HandTypeData'
    
    # Error response schema
    ErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          required:
            - success
            - command
            - error
          properties:
            success:
              const: false
            error:
              type: string
              description: Error message describing what went wrong
    
    # Health check schema
    HealthResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          required:
            - success
            - data
          properties:
            success:
              const: true
            data:
              type: object
              properties:
                status:
                  type: string
                  description: Service health status
                  enum: [healthy]
                  example: "healthy"

tags:
  - name: Odds Calculation
    description: Calculate winning probabilities for poker hands
  - name: Hand Analysis
    description: Analyze poker hand type probabilities
  - name: Health Check
    description: Monitor service health status