openapi: 3.0.3
info:
  title: Poker Hands Service API
  description: |
    A REST API service for calculating poker hand odds and probabilities.
    This service provides endpoints for calculating winning probabilities for different poker hands
    and analyzing hand type distributions.
    
    ## Features
    
    - **Odds Calculation**: Calculate winning probabilities for given hole cards and community board
    - **Hand Type Analysis**: Analyze probability distributions for different poker hand types
    - **Multiple Calculation Modes**: Support for exhaustive, Monte Carlo, and auto calculation modes
    - **Health Monitoring**: Service health check endpoint
    
    ## Getting Started
    
    The API accepts poker cards in the format `valueSuit` where:
    - Values: `2-9`, `T` (Ten), `J` (Jack), `Q` (Queen), `K` (King), `A` (Ace)
    - Suits: `h` (hearts), `d` (diamonds), `c` (clubs), `s` (spades)
    
    Example cards: `Ah` (Ace of hearts), `Td` (Ten of diamonds), `2c` (Two of clubs)
    
    ## Authentication
    
    This API does not require authentication at this time.
  version: 0.8.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3000
    description: Local service (default port)

# the API has no authentication
security: []

paths:
  /api/odds:
    post:
      tags:
        - Odds Calculation
      summary: Calculate poker hand winning odds
      description: |
        Calculate winning probabilities for multiple players' hole cards with an optional community board.
        Supports different calculation modes: exhaustive (exact calculation), Monte Carlo (statistical simulation),
        and auto (automatically selects the best method based on input size).
        
        The service validates all input card formats and ensures at least 2 players are provided.
        Each player must have exactly 2 hole cards, and the board can contain 0-5 community cards.
      operationId: calculateOdds
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OddsRequest'
            examples:
              example1:
                summary: Two players with no board cards
                value:
                  holes: [["Ah", "Kh"], ["Qd", "Jd"]]
              example2:
                summary: Three players with community board
                value:
                  holes: [["Ah", "As"], ["Kd", "Kh"], ["Qc", "Qd"]]
                  board: ["2h", "5d", "9c"]
              example3:
                summary: Monte Carlo mode with custom settings
                value:
                  holes: [["Ah", "Kh"], ["Qd", "Jd"]]
                  options:
                    mode: "monteCarlo"
                    sampleSize: 50000
      responses:
        '200':
          description: Successful odds calculation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OddsData'
              examples:
                success:
                  summary: Successful calculation
                  value:
                    players:
                      - holeCards: ["Ah", "Kh"]
                        winChance: 0.65
                        tieChance: 0.05
                        winChanceError: 0.02
                      - holeCards: ["Qd", "Jd"]
                        winChance: 0.3
                        tieChance: 0.05
        '400':
          description: Invalid input, or cards the library rejects (e.g. a card used twice)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidCards:
                  summary: Invalid card format
                  value: "Invalid card format: invalid"
                insufficientPlayers:
                  summary: Not enough players
                  value: "Holes must be provided as an array with at least 2 players"
                duplicateCards:
                  summary: A card is used twice
                  value: "Duplicates found in card list 'Ah,As,Ah,Kh'"
        '429':
          description: All calculation slots are busy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                tooManyRequests:
                  summary: Too many concurrent calculations
                  value: "Too many concurrent requests"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                internalError:
                  summary: Unexpected error
                  value: "Internal server error"

  /api/percentages:
    post:
      tags:
        - Hand Analysis
      summary: Calculate hand type probabilities
      description: |
        Calculate how often each player makes each hand type, over all possible boards.
        Each player's calculation treats the other players' hole cards as dead cards,
        since they can't appear on the board.

        The calculation is exhaustive: before the flop, it enumerates up to about
        2.1 million boards per player and can take a while.
      operationId: calculatePercentages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PercentagesRequest'
            examples:
              singlePlayer:
                summary: One player on the flop
                value:
                  holes: [["Ah", "Kh"]]
                  board: ["Qh", "Jh", "2c"]
              deadCards:
                summary: Two players; each one's cards are dead for the other
                value:
                  holes: [["Ah", "Kh"], ["Th", "9c"]]
                  board: ["Qh", "Jh", "2c"]
      responses:
        '200':
          description: Successful calculation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PercentagesResponse'
        '400':
          description: Invalid input, or cards the library rejects (e.g. a card used twice)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingCard:
                  summary: A player without two hole cards
                  value: "Player 1 must have exactly 2 hole cards"
                duplicateCards:
                  summary: A card is used twice
                  value: "Duplicates found in card list 'Ah,Kh,Ah,9c'"
        '429':
          description: All calculation slots are busy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                tooManyRequests:
                  summary: Too many concurrent calculations
                  value: "Too many concurrent requests"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                internalError:
                  summary: Unexpected error
                  value: "Internal server error"

  /health:
    get:
      tags:
        - Health Check
      summary: Service health check
      description: |
        Check the health status of the Poker Hands Service.
        Returns a simple status indicating whether the service is running properly.
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                healthy:
                  summary: Healthy service
                  value:
                    status: "healthy"

components:
  schemas:
    # Odds calculation schemas
    OddsRequest:
      type: object
      required:
        - holes
      properties:
        holes:
          type: array
          description: Array of player hole cards (each player must have exactly 2 cards)
          items:
            type: array
            items:
              type: string
              pattern: "^[2-9TJQKA][hdsc]$"
              description: A poker card in valueSuit format (e.g., 'Ah', 'Td', '2c')
            minItems: 2
            maxItems: 2
          minItems: 2
          maxItems: 10
          example: [["Ah", "Kh"], ["Qd", "Jd"]]
        board:
          type: array
          description: Community cards (optional, 0-5 cards)
          items:
            type: string
            pattern: "^[2-9TJQKA][hdsc]$"
            description: A poker card in valueSuit format
          maxItems: 5
          example: ["2h", "5d", "9c"]
        options:
          type: object
          description: Calculation options
          properties:
            mode:
              type: string
              enum: [auto, exhaustive, monteCarlo]
              description: "Calculation mode (default: auto)"
              example: "monteCarlo"
            threshold:
              type: integer
              minimum: 1
              description: "Threshold for auto mode (default: 10000)"
              example: 50000
            sampleSize:
              type: integer
              minimum: 1
              maximum: 1000000
              description: "Sample size for Monte Carlo mode (default: 10000, at most 1,000,000)"
              example: 100000
          example:
            mode: "monteCarlo"
            sampleSize: 50000
    
    OddsPlayerData:
      type: object
      required:
        - holeCards
        - winChance
        - tieChance
      properties:
        holeCards:
          type: array
          items:
            type: string
            description: The player's hole cards
          example: ["Ah", "Kh"]
        winChance:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Probability of winning (0-1)
          example: 0.65
        tieChance:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Probability of tying (0-1)
          example: 0.05
        winChanceError:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: 95% margin of error of winChance (Monte Carlo results only)
          example: 0.02
    
    OddsData:
      type: object
      required:
        - players
      properties:
        players:
          type: array
          description: Array of players with their hole cards and odds
          items:
            $ref: '#/components/schemas/OddsPlayerData'
    
    # Percentages calculation schemas
    PercentagesRequest:
      type: object
      required:
        - holes
      properties:
        holes:
          type: array
          description: "Array of player hole cards (each player must have exactly 2 cards); each player's cards are dead cards for the others"
          items:
            type: array
            items:
              type: string
              pattern: "^[2-9TJQKA][hdsc]$"
              description: A poker card in valueSuit format
            minItems: 2
            maxItems: 2
          minItems: 1
          maxItems: 10
          example: [["Ah", "Kh"]]
        board:
          type: array
          description: Community cards (optional, 0-5 cards)
          items:
            type: string
            pattern: "^[2-9TJQKA][hdsc]$"
            description: A poker card in valueSuit format
          maxItems: 5
          example: ["2h", "5d", "9c"]
    
    HandTypeData:
      type: object
      required:
        - count
        - percentage
      properties:
        count:
          type: integer
          minimum: 0
          description: Number of possible boards on which the player makes this hand type
          example: 123456
        percentage:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Share of all possible boards (0-1)
          example: 0.123456
    
    PercentagesData:
      type: object
      required:
        - highCard
        - pair
        - twoPair
        - threeOfAKind
        - straight
        - flush
        - fullHouse
        - fourOfAKind
        - straightFlush
        - royalFlush
      properties:
        highCard:
          $ref: '#/components/schemas/HandTypeData'
        pair:
          $ref: '#/components/schemas/HandTypeData'
        twoPair:
          $ref: '#/components/schemas/HandTypeData'
        threeOfAKind:
          $ref: '#/components/schemas/HandTypeData'
        straight:
          $ref: '#/components/schemas/HandTypeData'
        flush:
          $ref: '#/components/schemas/HandTypeData'
        fullHouse:
          $ref: '#/components/schemas/HandTypeData'
        fourOfAKind:
          $ref: '#/components/schemas/HandTypeData'
        straightFlush:
          $ref: '#/components/schemas/HandTypeData'
        royalFlush:
          $ref: '#/components/schemas/HandTypeData'
    
    PercentagesPlayerData:
      type: object
      required:
        - holeCards
        - percentages
      properties:
        holeCards:
          type: array
          items:
            type: string
            description: The player's hole cards
          example: ["Ah", "Kh"]
        percentages:
          $ref: '#/components/schemas/PercentagesData'

    PercentagesResponse:
      type: object
      required:
        - players
      properties:
        players:
          type: array
          description: One entry per player, in the order of holes
          items:
            $ref: '#/components/schemas/PercentagesPlayerData'

    # Error response schema
    ErrorResponse:
      type: string
      description: Error message describing what went wrong
    
    # Health check schema
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          description: Service health status
          enum: [healthy]
          example: "healthy"

tags:
  - name: Odds Calculation
    description: Calculate winning probabilities for poker hands
  - name: Hand Analysis
    description: Analyze poker hand type probabilities
  - name: Health Check
    description: Monitor service health status