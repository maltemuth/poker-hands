[package]
name = "poker-hands"
version = "0.14.0"
edition = "2024"
license = "MIT"
description = "Texas Hold'em hand ranking and exact odds, for Rust and as WebAssembly"
repository = "https://github.com/maltemuth/poker-hands"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[profile.release]
lto = true
codegen-units = 1


# wasm-pack's own wasm-opt is too old for the features current Rust emits;
# the npm build script runs binaryen's wasm-opt instead
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
